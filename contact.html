<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Aigocy</title>
    <meta name="description" content="Aigocy - Shaping the future with artificial intelligence.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <app-cursor></app-cursor>
    <app-header></app-header>

    <!-- Contact Section -->
    <section id="contact" class="contact-section" style="margin-top: 100px;">
        <div class="section-header reveal">
            <h2>Initiate Contact</h2>
            <p>Ready to integrate AI into your workflow?</p>
        </div>
        <div class="contact-container reveal">
            <form class="contact-form" id="contactForm">
                <div class="input-group">
                    <input type="text" id="name" required placeholder=" ">
                    <label for="name">Your Name</label>
                    <div class="input-glow"></div>
                </div>
                <div class="input-group">
                    <input type="email" id="email" required placeholder=" ">
                    <label for="email">Email Address</label>
                    <div class="input-glow"></div>
                </div>
                <div class="input-group">
                    <textarea id="message" required placeholder=" " rows="4"></textarea>
                    <label for="message">Message</label>
                    <div class="input-glow"></div>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Send Transmission <span class="btn-glow"></span></button>
            </form>
        </div>
    </section>

    <app-footer></app-footer>

    <script src="components.js"></script>
    <script src="script.js"></script>
</body>
</html>
